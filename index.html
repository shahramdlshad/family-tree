<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Family Tree</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">

  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f8f6f2;
      --bg2: #ffffff;
      --fg: #1a1714;
      --fg2: #5a5550;
      --fg3: #9a948e;
      --accent: #7c5c3a;
      --accent2: #c9a97a;
      --line: #d4c5b0;
      --node-bg: #ffffff;
      --node-border: #e0d4c3;
      --panel-bg: #ffffff;
      --shadow: 0 2px 12px rgba(100,80,50,0.10);
      --shadow-hover: 0 6px 24px rgba(100,80,50,0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1714;
        --bg2: #231f1b;
        --fg: #f0ebe4;
        --fg2: #b0a898;
        --fg3: #6e6760;
        --accent: #c9a97a;
        --accent2: #7c5c3a;
        --line: #3a332b;
        --node-bg: #2a2420;
        --node-border: #3d352c;
        --panel-bg: #231f1b;
        --shadow: 0 2px 12px rgba(0,0,0,0.35);
        --shadow-hover: 0 6px 24px rgba(0,0,0,0.5);
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --bg: #1a1714;
      --bg2: #231f1b;
      --fg: #f0ebe4;
      --fg2: #b0a898;
      --fg3: #6e6760;
      --accent: #c9a97a;
      --accent2: #7c5c3a;
      --line: #3a332b;
      --node-bg: #2a2420;
      --node-border: #3d352c;
      --panel-bg: #231f1b;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
      --shadow-hover: 0 6px 24px rgba(0,0,0,0.5);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    img { max-width: 100%; }
    [hidden]:not([hidden=until-found i]) { display: none !important; }

    #app { display: flex; flex-direction: column; height: 100%; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem max(12px, env(safe-area-inset-left, 0px));
      padding-right: max(12px, env(safe-area-inset-right, 0px));
      background: var(--bg2);
      border-bottom: 1px solid var(--node-border);
      gap: 0.5rem;
      flex-shrink: 0;
      z-index: 20;
      flex-wrap: wrap;
    }

    .header-left { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .sync-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      color: var(--fg2);
      border: 1px solid var(--node-border);
      white-space: nowrap;
    }
    .sync-badge.live { color: #2e7d32; border-color: color-mix(in srgb, #2e7d32 40%, transparent); }
    .sync-badge.err { color: #c0392b; border-color: color-mix(in srgb, #c0392b 40%, transparent); }

    .header-actions { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }

    button {
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.65; cursor: default; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent2); color: var(--fg); }

    .btn-cloud {
      background: #2e7d32;
      color: #fff;
    }
    .btn-cloud:hover:not(:disabled) {
      background: #256428;
    }

    .btn-ghost {
      background: transparent;
      color: var(--fg2);
      border: 1px solid var(--node-border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--node-bg); color: var(--fg); }

    .btn-icon {
      padding: 0.4rem 0.5rem;
      font-size: 1rem;
      line-height: 1;
      background: transparent;
      color: var(--fg2);
      border: 1px solid var(--node-border);
    }
    .btn-icon:hover:not(:disabled) { background: var(--node-bg); color: var(--fg); }

    #canvas-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #canvas-wrap.panning { cursor: grabbing; }

    #tree-canvas {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
    }

    .gen-label {
      position: absolute;
      left: 0;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg3);
      pointer-events: none;
      white-space: nowrap;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
    }

    /* Unified dotted rectangular enclosure around partners */
    .couple-box {
      position: absolute;
      border: 2px dotted var(--accent2);
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent2) 5%, transparent);
      pointer-events: none;
      z-index: 1;
    }

    .person-node {
      position: absolute;
      width: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      z-index: 2;
    }

    .node-photo-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    .node-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--node-color, var(--node-border));
      overflow: hidden;
      background: color-mix(in srgb, var(--node-color, var(--node-bg)) 14%, var(--node-bg));
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .person-node:hover .node-photo,
    .person-node.selected .node-photo {
      border-color: var(--node-color, var(--accent));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color, var(--accent)) 28%, transparent);
    }

    .node-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .node-initials {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--node-color, var(--accent));
    }

    .node-order-badge {
      position: absolute;
      top: -2px;
      left: -4px;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      border-radius: 11px;
      background: var(--node-color, var(--accent));
      color: #fff;
      font-size: 0.6875rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      z-index: 3;
      pointer-events: none;
    }

    .node-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--fg);
      text-align: center;
      line-height: 1.3;
      max-width: 100px;
      text-wrap: balance;
    }

    .node-years {
      font-size: 0.6875rem;
      color: var(--fg3);
      font-variant-numeric: tabular-nums;
    }

    .partner-heart {
      position: absolute;
      font-size: 0.875rem;
      color: var(--accent2);
      pointer-events: none;
      z-index: 3;
      background: var(--bg);
      padding: 0 3px;
      border-radius: 50%;
    }

    /* Side panel */
    #panel {
      position: fixed;
      top: 0; right: 0;
      height: 100%;
      width: min(360px, 100vw);
      background: var(--panel-bg);
      border-left: 1px solid var(--node-border);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #panel.open { transform: translateX(0); }

    .panel-header {
      position: sticky;
      top: 0;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--node-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      z-index: 1;
    }
    .panel-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--fg);
    }

    .panel-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; }

    .readonly-banner {
      font-size: 0.78rem;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      color: var(--fg2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .photo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
    }

    .photo-big {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--node-color, var(--accent));
      background: color-mix(in srgb, var(--node-color, var(--node-bg)) 14%, var(--node-bg));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .photo-big.readonly { cursor: default; }
    .photo-big img { width: 100%; height: 100%; object-fit: cover; }
    .photo-big .photo-initials {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--node-color, var(--accent));
    }
    .photo-big:not(.readonly):hover .photo-overlay { opacity: 1; }
    .photo-big .photo-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: 50%;
      font-size: 0.75rem;
      color: #fff;
      font-weight: 600;
      text-align: center;
    }
    #photo-input { display: none; }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    .field label { font-size: 0.75rem; font-weight: 600; color: var(--fg2); letter-spacing: 0.04em; text-transform: uppercase; }
    .field input, .field textarea, .field select {
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--node-border);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      width: 100%;
      transition: border-color 0.15s;
      outline: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field input:disabled, .field textarea:disabled, .field select:disabled { opacity: 0.8; cursor: default; }
    .field textarea { resize: vertical; min-height: 60px; }
    .field select option { background: var(--bg2); }

    /* Color picker row & expanded swatches */
    .color-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .color-picker-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 34px;
      height: 28px;
      border: 1px solid var(--node-border);
      border-radius: 6px;
      background: var(--bg);
      padding: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    .swatch-grid {
      display: grid;
      grid-template-columns: repeat(7, 26px);
      gap: 0.4rem;
      margin-top: 0.25rem;
    }
    .swatch-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid var(--node-border);
      flex-shrink: 0;
    }
    .swatch-btn:hover { transform: scale(1.14); border-color: var(--fg); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .rel-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .rel-section h3 { font-size: 0.8125rem; font-weight: 600; color: var(--fg2); letter-spacing: 0.03em; }

    .rel-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; min-height: 1.5rem; }
    .rel-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      transition: background 0.15s;
    }
    .rel-tag:hover { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); }
    .rel-tag.remove::after { content: " \00d7"; }
    .rel-tag.readonly { cursor: default; }
    .rel-tag.readonly::after { content: ""; }

    .rel-add-row { display: flex; gap: 0.5rem; align-items: center; }
    .rel-add-row select { flex: 1; font-family: inherit; font-size: 0.8125rem; color: var(--fg); background: var(--bg); border: 1px solid var(--node-border); border-radius: 6px; padding: 0.4rem 0.5rem; outline: none; }
    .rel-add-row select:focus { border-color: var(--accent); }
    .rel-add-row button { flex-shrink: 0; }

    .panel-actions { display: flex; gap: 0.5rem; padding: 1rem 1.25rem; border-top: 1px solid var(--node-border); margin-top: auto; }
    .panel-actions button { flex: 1; padding: 0.6rem; }

    .btn-danger { background: transparent; color: #c0392b; border: 1px solid #c0392b; }
    .btn-danger:hover { background: rgba(192,57,43,0.1); }

    #zoom-controls {
      position: fixed;
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
      right: max(1.25rem, env(safe-area-inset-right, 0px));
      display: flex;
      gap: 0.35rem;
      z-index: 10;
    }

    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop[hidden] { display: none; }

    .modal-box {
      background: var(--panel-bg);
      border-radius: 12px;
      width: min(400px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-hover);
      display: flex; flex-direction: column;
    }

    .modal-header {
      padding: 1.25rem 1.25rem 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; }
    .modal-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .modal-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--node-border);
      display: flex; gap: 0.5rem; justify-content: flex-end;
    }

    .login-error {
      font-size: 0.8rem;
      color: #c0392b;
      background: rgba(192, 57, 43, 0.1);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      word-break: break-word;
    }

    #connector-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .connector-line { stroke: var(--line); stroke-width: 2; fill: none; }
    .partner-line { stroke: var(--accent2); stroke-width: 2; stroke-dasharray: 4 4; fill: none; }

    #empty-state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; color: var(--fg3);
      pointer-events: none;
    }
    #empty-state.hidden { display: none; }
    .empty-icon { font-size: 3rem; }
    .empty-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--fg2); }
    .empty-sub { font-size: 0.875rem; text-align: center; max-width: 280px; }

    @media (max-width: 600px) {
      h1 { font-size: 1rem; }
      #panel { width: 100vw; }
      .field-row { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-left">
      <h1>Family Tree</h1>
      <span id="sync-status" class="sync-badge">Connecting...</span>
    </div>
    <div class="header-actions">
      <button class="btn-cloud" id="btn-save-cloud" title="Save all changes to Firebase cloud" hidden>&#9729; Save All</button>
      <button class="btn-ghost" id="btn-export" title="Download safety backup (.json)">&#8595; Export</button>
      <button class="btn-ghost" id="btn-import" title="Restore from backup file (.json)" hidden>&#8593; Import</button>
      <input type="file" id="import-input" accept=".json,application/json" style="display:none">
      <button class="btn-ghost btn-icon" id="btn-theme" title="Toggle theme">&#9788;&#65038;</button>
      <button class="btn-ghost btn-icon" id="btn-fit" title="Fit to screen">&#8861;</button>
      <button class="btn-ghost" id="btn-auth">&#128274; Editor Login</button>
      <button class="btn-primary" id="btn-add" hidden>+ Add person</button>
    </div>
  </header>

  <div id="canvas-wrap">
    <div id="tree-canvas">
      <svg id="connector-svg"></svg>
    </div>
    <div id="empty-state">
      <div class="empty-icon">&#127795;</div>
      <div class="empty-title">Your family tree awaits</div>
      <div class="empty-sub" id="empty-sub-text">Sign in as editor to add family members.</div>
    </div>
  </div>

  <div id="zoom-controls">
    <button class="btn-icon" id="btn-zoom-out" title="Zoom out">&#8722;</button>
    <button class="btn-icon" id="btn-zoom-in" title="Zoom in">+</button>
  </div>
</div>

<!-- Side panel -->
<div id="panel" role="dialog" aria-label="Person details">
  <div class="panel-header">
    <h2 id="panel-title">Details</h2>
    <button class="btn-icon" id="btn-panel-close" aria-label="Close">&#10005;</button>
  </div>
  <div class="panel-body">
    <div class="readonly-banner" id="readonly-banner">
      <span>View-only mode</span>
      <button class="btn-ghost" id="btn-banner-login" style="padding:0.25rem 0.6rem;font-size:0.75rem;">Unlock Edit</button>
    </div>

    <div class="photo-area">
      <div class="photo-big" id="panel-photo-btn" title="Upload photo">
        <div class="photo-initials" id="panel-photo-initials"></div>
        <img id="panel-photo-img" alt="Photo" style="display:none">
        <div class="photo-overlay">Change<br>photo</div>
      </div>
      <input type="file" id="photo-input" accept="image/*">
      <span id="photo-hint" style="font-size:0.75rem;color:var(--fg3)">Click to upload photo</span>
      <button type="button" class="btn-ghost editor-only" id="btn-remove-photo" style="padding:0.25rem 0.65rem;font-size:0.75rem;" hidden>Remove Photo</button>
    </div>

    <!-- Node Color Picker (14 curated swatches + custom color wheel) -->
    <div class="field editor-only" id="color-field-wrap">
      <div class="color-picker-header">
        <label for="edit-color">Node Color</label>
        <div class="color-picker-controls">
          <input id="edit-color" type="color" value="#7c5c3a" title="Pick any custom color">
          <button type="button" class="btn-ghost" id="btn-reset-color" style="padding:0.2rem 0.5rem;font-size:0.75rem;">Reset</button>
        </div>
      </div>
      <div class="swatch-grid" id="edit-swatches">
        <button type="button" class="swatch-btn" data-color="#7c5c3a" style="background:#7c5c3a" title="Bronze"></button>
        <button type="button" class="swatch-btn" data-color="#c53030" style="background:#c53030" title="Crimson"></button>
        <button type="button" class="swatch-btn" data-color="#c05621" style="background:#c05621" title="Terracotta"></button>
        <button type="button" class="swatch-btn" data-color="#d69e2e" style="background:#d69e2e" title="Gold"></button>
        <button type="button" class="swatch-btn" data-color="#38a169" style="background:#38a169" title="Emerald"></button>
        <button type="button" class="swatch-btn" data-color="#2f855a" style="background:#2f855a" title="Forest"></button>
        <button type="button" class="swatch-btn" data-color="#319795" style="background:#319795" title="Teal"></button>
        <button type="button" class="swatch-btn" data-color="#3182ce" style="background:#3182ce" title="Sky Blue"></button>
        <button type="button" class="swatch-btn" data-color="#2b6cb0" style="background:#2b6cb0" title="Royal Blue"></button>
        <button type="button" class="swatch-btn" data-color="#4c51bf" style="background:#4c51bf" title="Indigo"></button>
        <button type="button" class="swatch-btn" data-color="#6b46c1" style="background:#6b46c1" title="Royal Purple"></button>
        <button type="button" class="swatch-btn" data-color="#b83280" style="background:#b83280" title="Magenta"></button>
        <button type="button" class="swatch-btn" data-color="#d53f8c" style="background:#d53f8c" title="Rose Pink"></button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0sEtTAINtvJOvC2_RUEt2wB_S3CgLSZw",
    authDomain: "family-tree-5458e.firebaseapp.com",
    databaseURL: "https://family-tree-5458e-default-rtdb.firebaseio.com",
    projectId: "family-tree-5458e",
    storageBucket: "family-tree-5458e.firebasestorage.app",
    messagingSenderId: "129798754852",
    appId: "1:129798754852:web:db98b115252984bd97feb1",
    measurementId: "G-473BME077C"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const treeRef = ref(db, 'familyTreeData');

  const syncBadge = document.getElementById('sync-status');
  const btnAuth = document.getElementById('btn-auth');
  const btnAdd = document.getElementById('btn-add');
  const btnSaveCloud = document.getElementById('btn-save-cloud');
  const btnImport = document.getElementById('btn-import');
  const btnExport = document.getElementById('btn-export');
  const importInput = document.getElementById('import-input');
  const loginBackdrop = document.getElementById('login-backdrop');
  const loginError = document.getElementById('login-error');

  let isEditor = false;
  let isRemoteUpdate = false;
  let hasInitialFit = false;
  let initialCloudLoaded = false;

  /* ── State ── */
  let people = [];
  let nextId = 1;
  let selectedId = null;
  let panX = 0, panY = 0, zoom = 1;
  let isPanning = false, panStart = null;
  let theme = 'system';

  const NODE_W = 110, NODE_H = 110, NODE_GAP_X = 36, NODE_GAP_Y = 64;
  const GEN_LABELS = ['Great-grandparents', 'Grandparents', 'Parents', 'Children', 'Grandchildren'];
  const GEN_H = NODE_H + NODE_GAP_Y;

  /* ── Auth State Listener ── */
  onAuthStateChanged(auth, (user) => {
    isEditor = !!user;
    updateEditorUI();
    if (selectedId) refreshPanelData(selectedId);
  });

  function updateEditorUI() {
    btnAdd.hidden = !isEditor;
    btnSaveCloud.hidden = !isEditor;
    btnImport.hidden = !isEditor;
    btnAuth.textContent = isEditor ? 'Sign Out' : '🔒 Editor Login';
    document.getElementById('readonly-banner').hidden = isEditor;
    document.getElementById('photo-hint').hidden = !isEditor;
    document.getElementById('gen-order-wrap').hidden = !isEditor;
    document.getElementById('panel-photo-btn').classList.toggle('readonly', !isEditor);
    document.getElementById('empty-sub-text').innerHTML = isEditor
      ? 'Click <strong>+ Add person</strong> to place your first family member.'
      : 'Click <strong>Editor Login</strong> to add family members.';

    ['edit-first', 'edit-last', 'edit-birth', 'edit-death', 'edit-gen', 'edit-order', 'edit-notes'].forEach(id => {
      document.getElementById(id).disabled = !isEditor;
    });

    document.querySelectorAll('.editor-only').forEach(el => {
      el.hidden = !isEditor;
    });

    if (selectedId) {
      const p = people.find(x => x.id === selectedId);
      document.getElementById('btn-remove-photo').hidden = !(isEditor && p && p.photo);
    }
  }

  function openLoginModal() {
    loginError.hidden = true;
    document.getElementById('login-pass').value = '';
    loginBackdrop.hidden = false;
    setTimeout(() => document.getElementById('login-email').focus(), 50);
  }

  btnAuth.addEventListener('click', () => {
    if (isEditor) {
      signOut(auth);
    } else {
      openLoginModal();
    }
  });

  document.getElementById('btn-banner-login').addEventListener('click', openLoginModal);
  document.getElementById('btn-login-close').addEventListener('click', () => { loginBackdrop.hidden = true; });
  document.getElementById('btn-login-cancel').addEventListener('click', () => { loginBackdrop.hidden = true; });
  loginBackdrop.addEventListener('click', e => { if (e.target === loginBackdrop) loginBackdrop.hidden = true; });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.hidden = true;
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    const submitBtn = document.getElementById('btn-login-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      loginBackdrop.hidden = true;
      if (people.length > 0 && !initialCloudLoaded) save();
    } catch (err) {
      console.error('Firebase Auth Error:', err);
      const code = err && err.code ? err.code : 'unknown-error';
      const msg = err && err.message ? err.message : '';
      loginError.textContent = 'Error (' + code + '): ' + msg;
      loginError.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });

  /* ── Export & Import Safety Backups ── */
  btnExport.addEventListener('click', async () => {
    const payload = JSON.stringify({
      version: 2,
      exportedAt: new Date().toISOString(),
      nextId,
      people
    }, null, 2);
    const filename = 'family-tree-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    const blob = new Blob([payload], { type: 'application/json' });

    try {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        await navigator.share({
          files: [file],
          title: 'Family Tree Backup'
        });
        return;
      }
    } catch (e) {
      if (e.name === 'AbortError') return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  btnImport.addEventListener('click', () => {
    if (!isEditor) return;
    importInput.click();
  });

  importInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file || !isEditor) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const importedList = Array.isArray(parsed) ? parsed : parsed.people;
        if (!Array.isArray(importedList)) {
          alert('Invalid backup file: missing family member data.');
          return;
        }
        if (!confirm('Replace the current tree with ' + importedList.length + ' people from this backup file?')) {
          return;
        }
        people = normalizePeople(importedList);
        nextId = parsed.nextId || (Math.max(0, ...people.map(p => Number(p.id) || 0)) + 1);
        syncGenerations();
        selectedId = null;
        panel.classList.remove('open');
        save();
        render();
        if (people.length > 0) fitToScreen();
        alert('Backup restored successfully!');
      } catch (err) {
        alert('Could not read backup file. Please make sure it is a valid .json file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ── Normalize Arrays ── */
  function normalizePeople(list) {
    return (list || []).filter(Boolean).map(p => ({
      ...p,
      color: p.color || null,
      photo: p.photo || null,
      order: (p.order !== undefined && p.order !== null && p.order !== '') ? Number(p.order) : null,
      parents: Array.isArray(p.parents) ? p.parents : [],
      children: Array.isArray(p.children) ? p.children : [],
      partners: Array.isArray(p.partners) ? p.partners : []
    }));
  }

  /* ── Persist (Local + Cloud) ── */
  function save(isManualButton = false) {
    try { localStorage.setItem('ftree_v2', JSON.stringify({ people, nextId })); } catch(e) {}
    if (!isEditor || (isRemoteUpdate && !isManualButton)) return;

    syncBadge.textContent = 'Saving...';
    syncBadge.className = 'sync-badge';
    if (isManualButton) {
      btnSaveCloud.disabled = true;
      btnSaveCloud.textContent = '☁ Saving...';
    }

    return set(treeRef, { people, nextId })
      .then(() => {
        syncBadge.textContent = 'Synced ✓';
        syncBadge.className = 'sync-badge live';
        if (isManualButton) {
          btnSaveCloud.textContent = '☁ Saved ✓';
          setTimeout(() => {
            btnSaveCloud.disabled = false;
            btnSaveCloud.textContent = '☁ Save All';
          }, 1600);
        }
      })
      .catch(err => {
        console.error('Firebase Save Error:', err);
        syncBadge.textContent = 'Save Failed!';
        syncBadge.className = 'sync-badge err';
        if (isManualButton) {
          btnSaveCloud.disabled = false;
          btnSaveCloud.textContent = '☁ Save All';
        }
        alert('Cloud save failed (' + (err.code || err.message) + '). Check your Firebase Realtime Database Rules.');
      });
  }

  /* ── Header "Save All" Button ── */
  btnSaveCloud.addEventListener('click', () => {
    if (!isEditor) return;
    if (selectedId && panel.classList.contains('open')) {
      const p = people.find(x => x.id === selectedId);
      if (p) {
        p.first = document.getElementById('edit-first').value.trim();
        p.last = document.getElementById('edit-last').value.trim();
        p.birth = document.getElementById('edit-birth').value.trim();
        p.death = document.getElementById('edit-death').value.trim();
        p.gen = parseInt(document.getElementById('edit-gen').value);
        const ordVal = document.getElementById('edit-order').value.trim();
        p.order = ordVal !== '' ? parseInt(ordVal, 10) : null;
        p.notes = document.getElementById('edit-notes').value.trim();
        syncGenerations();
        document.getElementById('edit-gen').value = String(p.gen);
        document.getElementById('panel-title').textContent = fullName(p);
        document.getElementById('panel-photo-initials').textContent = initials(p);
        render();
      }
    }
    save(true);
  });

  function loadLocal() {
    try {
      const d = JSON.parse(localStorage.getItem('ftree_v2') || 'null');
      if (d) {
        people = normalizePeople(d.people);
        nextId = d.nextId || 1;
        syncGenerations();
      }
    } catch(e) {}
  }

  /* ── Real-Time Listener from Cloud ── */
  onValue(treeRef, (snapshot) => {
    const data = snapshot.val();
    initialCloudLoaded = true;
    syncBadge.textContent = 'Synced ✓';
    syncBadge.className = 'sync-badge live';

    if (data && data.people) {
      isRemoteUpdate = true;
      people = normalizePeople(data.people);
      nextId = data.nextId || (Math.max(0, ...people.map(p => p.id)) + 1);
      syncGenerations();
      try { localStorage.setItem('ftree_v2', JSON.stringify({ people, nextId })); } catch(e) {}
      render();
      if (selectedId && people.some(x => x.id === selectedId)) {
        refreshPanelData(selectedId);
      }
      if (!hasInitialFit && people.length > 0) {
        fitToScreen();
        hasInitialFit = true;
      }
      isRemoteUpdate = false;
    } else if (people.length > 0 && isEditor) {
      save();
    }
  }, (error) => {
    console.error(error);
    syncBadge.textContent = 'Read Locked';
    syncBadge.className = 'sync-badge err';
  });

  /* ── Generation Synchronization ── */
  function syncGenerations() {
    let changed = true;
    let safety = 0;
    while (changed && safety < 20) {
      changed = false;
      safety++;
      people.forEach(person => {
        if (person.parents && person.parents.length > 0) {
          const parentGens = person.parents
            .map(pid => people.find(x => x.id === pid))
            .filter(Boolean)
            .map(p => p.gen);
          if (parentGens.length > 0) {
            const targetGen = Math.max(...parentGens) + 1;
            if (person.gen !== targetGen) {
              person.gen = targetGen;
              changed = true;
            }
          }
        }
        if (person.partners && person.partners.length > 0) {
          person.partners.forEach(partId => {
            const partner = people.find(x => x.id === partId);
            if (partner && partner.gen !== person.gen) {
              const maxGen = Math.max(person.gen, partner.gen);
              person.gen = maxGen;
              partner.gen = maxGen;
              changed = true;
            }
          });
        }
      });
    }
  }

  /* ── DOM refs ── */
  const canvas = document.getElementById('tree-canvas');
  const svg = document.getElementById('connector-svg');
  const wrap = document.getElementById('canvas-wrap');
  const panel = document.getElementById('panel');
  const emptyState = document.getElementById('empty-state');
  const modal = document.getElementById('modal-backdrop');

  /* ── Theme ── */
  const btnTheme = document.getElementById('btn-theme');
  btnTheme.addEventListener('click', () => {
    theme = theme === 'system' ? 'dark' : theme === 'dark' ? 'light' : 'system';
    applyTheme();
    try { localStorage.setItem('ftree_theme', theme); } catch(e) {}
  });
  function applyTheme() {
    const root = document.documentElement;
    if (theme === 'dark') { root.setAttribute('data-theme', 'dark'); btnTheme.textContent = '☀︎'; }
    else if (theme === 'light') { root.setAttribute('data-theme', 'light'); btnTheme.textContent = '🌙'; }
    else { root.removeAttribute('data-theme'); btnTheme.textContent = '☀︎'; }
  }
  try { const t = localStorage.getItem('ftree_theme'); if (t) theme = t; } catch(e) {}
  applyTheme();

  /* ── Layout (Groups connected spouses together & orders siblings 1 -> last) ── */
  function computeLayout() {
    const gens = {};
    people.forEach(p => {
      const g = p.gen;
      if (!gens[g]) gens[g] = [];
      gens[g].push(p);
    });

    const partnerClusters = [];

    Object.keys(gens).sort((a, b) => Number(a) - Number(b)).forEach(g => {
      const members = gens[g];
      const prevGen = gens[parseInt(g) - 1] || [];

      const baseCompare = (a, b) => {
        const aParent = (a.parents || []).find(pid => prevGen.some(x => x.id === pid));
        const bParent = (b.parents || []).find(pid => prevGen.some(x => x.id === pid));
        const aIdx = aParent ? prevGen.findIndex(x => x.id === aParent) : 999;
        const bIdx = bParent ? prevGen.findIndex(x => x.id === bParent) : 999;
        if (aIdx !== bIdx) return aIdx - bIdx;

        const aOrd = (a.order !== null && a.order !== undefined) ? Number(a.order) : 999999;
        const bOrd = (b.order !== null && b.order !== undefined) ? Number(b.order) : 999999;
        if (aOrd !== bOrd) return aOrd - bOrd;

        return a.id - b.id;
      };

      members.sort(baseCompare);

      // Build connected partner groups (BFS so multi-spouse families stay in one contiguous cluster)
      const arranged = [];
      const visited = new Set();

      members.forEach(m => {
        if (visited.has(m.id)) return;
        const cluster = [];
        const queue = [m];
        visited.add(m.id);

        while (queue.length > 0) {
          const curr = queue.shift();
          cluster.push(curr);
          (curr.partners || []).forEach(pid => {
            const partner = members.find(x => x.id === pid);
            if (partner && !visited.has(partner.id)) {
              visited.add(partner.id);
              queue.push(partner);
            }
          });
        }

        // Keep the primary member (with parents or order) on the left of their partner(s)
        cluster.sort(baseCompare);
        arranged.push(...cluster);
        if (cluster.length > 1) {
          partnerClusters.push(cluster.map(x => x.id));
        }
      });

      gens[g] = arranged;
    });

    const positions = {};
    Object.entries(gens).forEach(([gen, members]) => {
      const g = parseInt(gen);
      const count = members.length;
      const totalW = count * NODE_W + (count - 1) * NODE_GAP_X;
      const startX = -totalW / 2 + NODE_W / 2;
      members.forEach((p, i) => {
        positions[p.id] = { x: startX + i * (NODE_W + NODE_GAP_X), y: g * GEN_H + 48 };
      });
    });

    return { positions, partnerClusters };
  }

  /* ── Render ── */
  function render() {
    Array.from(canvas.querySelectorAll('.person-node,.partner-heart,.gen-label,.couple-box')).forEach(el => el.remove());
    svg.innerHTML = '';
    emptyState.classList.toggle('hidden', people.length > 0);
    if (people.length === 0) return;

    const { positions: pos, partnerClusters } = computeLayout();
    const xs = Object.values(pos).map(p => p.x);
    const ys = Object.values(pos).map(p => p.y);
    const minX = Math.min(...xs) - NODE_W;
    const maxX = Math.max(...xs) + NODE_W;
    const minY = Math.min(...ys) - 60;
    const maxY = Math.max(...ys) + NODE_H + 20;
    const W = maxX - minX + 160;
    const H = maxY - minY + 80;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.style.width = W + 'px';
    svg.style.height = H + 'px';

    const ox = -minX + 80;
    const oy = -minY + 40;

    [...new Set(people.map(p => p.gen))].sort((a, b) => a - b).forEach(g => {
      const lbl = document.createElement('div');
      lbl.className = 'gen-label';
      lbl.textContent = GEN_LABELS[g] || ('Generation ' + g);
      lbl.style.top = (g * GEN_H + oy) + 'px';
      canvas.appendChild(lbl);
    });

    // Draw ONE unified dotted rectangular enclosure per partner cluster & connect adjacent spouses
    partnerClusters.forEach(clusterIds => {
      const clusterCoords = clusterIds.map(id => ({ id, pos: pos[id] })).filter(x => x.pos);
      if (clusterCoords.length < 2) return;

      clusterCoords.sort((a, b) => a.pos.x - b.pos.x);

      const leftX = clusterCoords[0].pos.x + ox - 10;
      const rightX = clusterCoords[clusterCoords.length - 1].pos.x + ox + NODE_W + 10;
      const topY = Math.min(...clusterCoords.map(c => c.pos.y)) + oy - 10;
      const bottomY = Math.max(...clusterCoords.map(c => c.pos.y)) + oy + NODE_H + 14;

      const box = document.createElement('div');
      box.className = 'couple-box';
      box.style.left = leftX + 'px';
      box.style.top = topY + 'px';
      box.style.width = (rightX - leftX) + 'px';
      box.style.height = (bottomY - topY) + 'px';
      canvas.appendChild(box);

      // Draw dashed line + heart strictly between adjacent members so nothing overlaps circles
      for (let i = 0; i < clusterCoords.length - 1; i++) {
        const leftMember = clusterCoords[i];
        const rightMember = clusterCoords[i + 1];

        const x1 = leftMember.pos.x + ox + NODE_W - 16;
        const x2 = rightMember.pos.x + ox + 16;
        const y = leftMember.pos.y + oy + 36;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y);
        line.setAttribute('x2', x2); line.setAttribute('y2', y);
        line.setAttribute('class', 'partner-line');
        svg.appendChild(line);

        const hx = (x1 + x2) / 2;
        const heart = document.createElement('div');
        heart.className = 'partner-heart';
        heart.textContent = '♥';
        heart.style.left = (hx - 9) + 'px';
        heart.style.top = (y - 10) + 'px';
        canvas.appendChild(heart);
      }
    });

    // Parent -> Child branch lines
    people.forEach(p => {
      const pp = pos[p.id];
      if (!pp) return;
      const px = pp.x + ox + NODE_W / 2;
      const py = pp.y + oy;

      (p.children || []).forEach(childId => {
        const cp = pos[childId];
        if (!cp) return;
        const cx = cp.x + ox + NODE_W / 2;
        const cy = cp.y + oy;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const my = cy - 20;
        path.setAttribute('d', 'M' + px + ',' + (py + NODE_H) + ' C' + px + ',' + my + ' ' + cx + ',' + my + ' ' + cx + ',' + cy);
        path.setAttribute('class', 'connector-line');
        if (p.color) path.style.stroke = p.color;
        svg.appendChild(path);
      });
    });

    // Person nodes
    people.forEach(p => {
      const pp = pos[p.id];
      if (!pp) return;
      const node = document.createElement('div');
      node.className = 'person-node' + (p.id === selectedId ? ' selected' : '');
      node.style.left = (pp.x + ox) + 'px';
      node.style.top = (pp.y + oy) + 'px';
      node.dataset.id = p.id;
      if (p.color) {
        node.style.setProperty('--node-color', p.color);
      }

      const photoWrap = document.createElement('div');
      photoWrap.className = 'node-photo-wrap';

      if (p.order !== null && p.order !== undefined) {
        const badge = document.createElement('div');
        badge.className = 'node-order-badge';
        badge.textContent = '#' + p.order;
        badge.title = 'Child order #' + p.order;
        photoWrap.appendChild(badge);
      }

      const photoDiv = document.createElement('div');
      photoDiv.className = 'node-photo';
      if (p.photo) {
        const img = document.createElement('img');
        img.src = p.photo; img.alt = fullName(p);
        photoDiv.appendChild(img);
      } else {
        const ini = document.createElement('div');
        ini.className = 'node-initials';
        ini.textContent = initials(p);
        photoDiv.appendChild(ini);
      }

      photoWrap.appendChild(photoDiv);

      const nameDiv = document.createElement('div');
      nameDiv.className = 'node-name';
      nameDiv.textContent = fullName(p);

      node.appendChild(photoWrap);
      node.appendChild(nameDiv);

      if (p.birth || p.death) {
        const yr = document.createElement('div');
        yr.className = 'node-years';
        yr.textContent = (p.birth || '') + (p.death ? ' – ' + p.death : '');
        node.appendChild(yr);
      }

      node.addEventListener('click', e => { e.stopPropagation(); selectPerson(p.id); });
      canvas.appendChild(node);
    });
  }

  function fullName(p) { return [p.first, p.last].filter(Boolean).join(' ') || 'Unnamed'; }
  function initials(p) { return [(p.first || '')[0], (p.last || '')[0]].filter(Boolean).join('').toUpperCase() || '?'; }

  /* ── Panel & Color Picker Controls ── */
  const editColorInput = document.getElementById('edit-color');
  const panelPhotoBtn = document.getElementById('panel-photo-btn');
  const btnRemovePhoto = document.getElementById('btn-remove-photo');

  function applyPanelColorPreview(colorHex) {
    if (colorHex) {
      panelPhotoBtn.style.setProperty('--node-color', colorHex);
    } else {
      panelPhotoBtn.style.removeProperty('--node-color');
    }
  }

  editColorInput.addEventListener('input', e => {
    if (!isEditor || !selectedId) return;
    const p = people.find(x => x.id === selectedId);
    if (!p) return;
    p.color = e.target.value;
    applyPanelColorPreview(p.color);
    render();
  });

  editColorInput.addEventListener('change', () => {
    if (!isEditor || !selectedId) return;
    save();
  });

  document.getElementById('edit-swatches').addEventListener('click', e => {
    const btn = e.target.closest('.swatch-btn');
    if (!btn || !isEditor || !selectedId) return;
    const hex = btn.dataset.color;
    editColorInput.value = hex;
    const p = people.find(x => x.id === selectedId);
    if (!p) return;
    p.color = hex;
    applyPanelColorPreview(hex);
    save();
    render();
  });

  document.getElementById('btn-reset-color').addEventListener('click', () => {
    if (!isEditor || !selectedId) return;
    const p = people.find(x => x.id === selectedId);
    if (!p) return;
    p.color = null;
    editColorInput.value = '#7c5c3a';
    applyPanelColorPreview(null);
    save();
    render();
  });

  document.getElementById('new-swatches').addEventListener('click', e => {
    const btn = e.target.closest('.swatch-btn');
    if (!btn) return;
    document.getElementById('new-color').value = btn.dataset.color;
  });

  function refreshPanelData(id) {
    const p = people.find(x => x.id === id);
    if (!p) return;
    document.getElementById('panel-title').textContent = fullName(p);
    document.getElementById('edit-first').value = p.first || '';
    document.getElementById('edit-last').value = p.last || '';
    document.getElementById('edit-birth').value = p.birth || '';
    document.getElementById('edit-death').value = p.death || '';
    document.getElementById('edit-gen').value = String(p.gen);
    document.getElementById('edit-order').value = (p.order !== null && p.order !== undefined) ? String(p.order) : '';
    document.getElementById('edit-notes').value = p.notes || '';
    editColorInput.value = p.color || '#7c5c3a';
    applyPanelColorPreview(p.color);

    const img = document.getElementById('panel-photo-img');
    const ini = document.getElementById('panel-photo-initials');
    if (p.photo) {
      img.src = p.photo;
      img.style.display = 'block';
      ini.style.display = 'none';
      btnRemovePhoto.hidden = !isEditor;
    } else {
      img.style.display = 'none';
      ini.style.display = '';
      ini.textContent = initials(p);
      btnRemovePhoto.hidden = true;
    }

    populateRelSelects(id);
    renderRelTags('parents', p.parents || [], id);
    renderRelTags('children', p.children || [], id);
    renderRelTags('partners', p.partners || [], id);
  }

  function selectPerson(id) {
    selectedId = id;
    panel.classList.add('open');
    refreshPanelData(id);
    render();
  }

  function populateRelSelects(currentId) {
    const opts = people.filter(x => x.id !== currentId)
      .map(x => '<option value="' + x.id + '">' + fullName(x) + '</option>').join('');
    const blank = '<option value="">— select person —</option>';
    document.getElementById('parent-select').innerHTML = blank + opts;
    document.getElementById('child-select').innerHTML = blank + opts;
    document.getElementById('partner-select').innerHTML = blank + opts;
  }

  function renderRelTags(type, ids, currentId) {
    const container = document.getElementById(type + '-tags');
    container.innerHTML = '';
    ids.forEach(rid => {
      const rp = people.find(x => x.id === rid);
      if (!rp) return;
      const tag = document.createElement('div');
      tag.className = 'rel-tag ' + (isEditor ? 'remove' : 'readonly');
      tag.textContent = fullName(rp);
      if (isEditor) {
        tag.addEventListener('click', () => removeRelation(type, currentId, rid));
      }
      container.appendChild(tag);
    });
  }

  document.getElementById('btn-add-parent').addEventListener('click', () => {
    if (!isEditor) return;
    const sel = document.getElementById('parent-select').value;
    if (!sel || !selectedId) return;
    const parentId = parseInt(sel);
    const child = people.find(x => x.id === selectedId);
    const parent = people.find(x => x.id === parentId);
    if (!child || !parent) return;
    if (!child.parents.includes(parentId)) child.parents.push(parentId);
    if (!parent.children.includes(selectedId)) parent.children.push(selectedId);
    syncGenerations();
    document.getElementById('edit-gen').value = String(child.gen);
    save(); render(); renderRelTags('parents', child.parents, selectedId);
  });

  document.getElementById('btn-add-child').addEventListener('click', () => {
    if (!isEditor) return;
    const sel = document.getElementById('child-select').value;
    if (!sel || !selectedId) return;
    const childId = parseInt(sel);
    const parent = people.find(x => x.id === selectedId);
    const child = people.find(x => x.id === childId);
    if (!parent || !child) return;
    if (!parent.children.includes(childId)) parent.children.push(childId);
    if (!child.parents.includes(selectedId)) child.parents.push(selectedId);
    syncGenerations();
    save(); render(); renderRelTags('children', parent.children, selectedId);
  });

  document.getElementById('btn-add-partner').addEventListener('click', () => {
    if (!isEditor) return;
    const sel = document.getElementById('partner-select').value;
    if (!sel || !selectedId) return;
    const rid = parseInt(sel);
    const p = people.find(x => x.id === selectedId);
    const other = people.find(x => x.id === rid);
    if (!p || !other) return;
    if (!p.partners.includes(rid)) p.partners.push(rid);
    if (!other.partners.includes(selectedId)) other.partners.push(selectedId);
    syncGenerations();
    document.getElementById('edit-gen').value = String(p.gen);
    save(); render(); renderRelTags('partners', p.partners, selectedId);
  });

  function removeRelation(type, fromId, toId) {
    if (!isEditor) return;
    const p = people.find(x => x.id === fromId);
    const other = people.find(x => x.id === toId);
    if (!p) return;

    if (type === 'parents') {
      p.parents = p.parents.filter(id => id !== toId);
      if (other) other.children = (other.children || []).filter(id => id !== fromId);
    } else if (type === 'children') {
      p.children = p.children.filter(id => id !== toId);
      if (other) other.parents = (other.parents || []).filter(id => id !== fromId);
    } else if (type === 'partners') {
      p.partners = p.partners.filter(id => id !== toId);
      if (other) other.partners = (other.partners || []).filter(id => id !== fromId);
    }
    save(); render();
    renderRelTags(type, p[type] || [], fromId);
  }

  /* ── Save ── */
  document.getElementById('btn-save').addEventListener('click', () => {
    if (!isEditor || !selectedId) return;
    const p = people.find(x => x.id === selectedId);
    p.first = document.getElementById('edit-first').value.trim();
    p.last = document.getElementById('edit-last').value.trim();
    p.birth = document.getElementById('edit-birth').value.trim();
    p.death = document.getElementById('edit-death').value.trim();
    p.gen = parseInt(document.getElementById('edit-gen').value);
    const ordVal = document.getElementById('edit-order').value.trim();
    p.order = ordVal !== '' ? parseInt(ordVal, 10) : null;
    p.notes = document.getElementById('edit-notes').value.trim();
    syncGenerations();
    document.getElementById('edit-gen').value = String(p.gen);
    save(); render();
    document.getElementById('panel-title').textContent = fullName(p);
    document.getElementById('panel-photo-initials').textContent = initials(p);
  });

  /* ── Delete ── */
  document.getElementById('btn-delete').addEventListener('click', () => {
    if (!isEditor || !selectedId) return;
    if (!confirm('Remove this person from the tree?')) return;
    const id = selectedId;
    people = people.filter(x => x.id !== id);
    people.forEach(p => {
      p.parents = (p.parents || []).filter(x => x !== id);
      p.children = (p.children || []).filter(x => x !== id);
      p.partners = (p.partners || []).filter(x => x !== id);
    });
    selectedId = null;
    panel.classList.remove('open');
    save(); render();
  });

  /* ── Photo Upload & Remove ── */
  document.getElementById('panel-photo-btn').addEventListener('click', () => {
    if (!isEditor) return;
    document.getElementById('photo-input').click();
  });

  btnRemovePhoto.addEventListener('click', () => {
    if (!isEditor || !selectedId) return;
    const p = people.find(x => x.id === selectedId);
    if (!p) return;
    p.photo = null;
    document.getElementById('panel-photo-img').style.display = 'none';
    const ini = document.getElementById('panel-photo-initials');
    ini.style.display = '';
    ini.textContent = initials(p);
    btnRemovePhoto.hidden = true;
    save(); render();
  });

  document.getElementById('photo-input').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file || !selectedId || !isEditor) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const imgObj = new Image();
      imgObj.onload = () => {
        const size = 160;
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        const minSide = Math.min(imgObj.width, imgObj.height);
        const sx = (imgObj.width - minSide) / 2;
        const sy = (imgObj.height - minSide) / 2;
        ctx.drawImage(imgObj, sx, sy, minSide, minSide, 0, 0, size, size);
        const compressedDataUrl = c.toDataURL('image/jpeg', 0.75);

        const p = people.find(x => x.id === selectedId);
        if (!p) return;
        p.photo = compressedDataUrl;
        const img = document.getElementById('panel-photo-img');
        img.src = p.photo; img.style.display = 'block';
        document.getElementById('panel-photo-initials').style.display = 'none';
        btnRemovePhoto.hidden = false;
        save(); render();
      };
      imgObj.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  /* ── Panel close ── */
  document.getElementById('btn-panel-close').addEventListener('click', () => {
    panel.classList.remove('open');
    selectedId = null;
    render();
  });

  /* ── Add person modal ── */
  document.getElementById('btn-add').addEventListener('click', () => {
    if (!isEditor) return;
    document.getElementById('new-first').value = '';
    document.getElementById('new-last').value = '';
    document.getElementById('new-birth').value = '';
    document.getElementById('new-order').value = '';
    document.getElementById('new-gen').value = '2';
    document.getElementById('new-color').value = '#7c5c3a';
    modal.hidden = false;
    setTimeout(() => document.getElementById('new-first').focus(), 50);
  });
  function closeModal() { modal.hidden = true; }
  document.getElementById('btn-modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  document.getElementById('btn-modal-create').addEventListener('click', () => {
    if (!isEditor) return;
    const first = document.getElementById('new-first').value.trim();
    if (!first) { document.getElementById('new-first').focus(); return; }
    const pickedColor = document.getElementById('new-color').value;
    const ordVal = document.getElementById('new-order').value.trim();
    const p = {
      id: nextId++,
      first,
      last: document.getElementById('new-last').value.trim(),
      birth: document.getElementById('new-birth').value.trim(),
      death: '', notes: '', photo: null,
      order: ordVal !== '' ? parseInt(ordVal, 10) : null,
      color: pickedColor === '#7c5c3a' ? null : pickedColor,
      gen: parseInt(document.getElementById('new-gen').value),
      parents: [], children: [], partners: []
    };
    people.push(p);
    save(); closeModal(); render();
    if (people.length === 1) fitToScreen();
  });

  /* ── Pan & zoom ── */
  function applyTransform() {
    canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
  }

  wrap.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target !== wrap && e.target !== canvas && e.target !== svg) return;
    isPanning = true;
    panStart = { x: e.clientX - panX, y: e.clientY - panY };
    wrap.classList.add('panning');
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    panX = e.clientX - panStart.x;
    panY = e.clientY - panStart.y;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { isPanning = false; wrap.classList.remove('panning'); });

  let touch0 = null, touch0pan = null;
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { touch0 = e.touches[0]; touch0pan = { x: panX, y: panY }; }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && touch0) {
      panX = touch0pan.x + (e.touches[0].clientX - touch0.clientX);
      panY = touch0pan.y + (e.touches[0].clientY - touch0.clientY);
      applyTransform();
    }
  }, { passive: true });
  wrap.addEventListener('touchend', () => { touch0 = null; });

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    panX = mx - (mx - panX) * factor;
    panY = my - (my - panY) * factor;
    zoom = Math.max(0.25, Math.min(3, zoom * factor));
    applyTransform();
  }, { passive: false });

  document.getElementById('btn-zoom-in').addEventListener('click', () => { zoom = Math.min(3, zoom * 1.2); applyTransform(); });
  document.getElementById('btn-zoom-out').addEventListener('click', () => { zoom = Math.max(0.25, zoom / 1.2); applyTransform(); });

  function fitToScreen() {
    if (people.length === 0) return;
    const rect = wrap.getBoundingClientRect();
    const cW = parseFloat(canvas.style.width) || 400;
    const cH = parseFloat(canvas.style.height) || 400;
    zoom = Math.min(1, Math.min(rect.width / cW, rect.height / cH) * 0.85);
    panX = (rect.width - cW * zoom) / 2;
    panY = (rect.height - cH * zoom) / 2;
    applyTransform();
  }

  document.getElementById('btn-fit').addEventListener('click', fitToScreen);

  wrap.addEventListener('click', e => {
    if (e.target === wrap || e.target === canvas || e.target === svg) {
      panel.classList.remove('open');
      selectedId = null;
      render();
    }
  });

  /* ── Init ── */
  updateEditorUI();
  loadLocal();
  render();
  if (people.length > 0) {
    fitToScreen();
    hasInitialFit = true;
  }
</script>

</body>
